name: Havelo Storage
version: "0.1.1"
image: ghcr.io/havelo-app/havelo-storage-ha-{arch}
slug: havelo_storage
description: Keeps Havelo's favorites, views, cards and maps in sync across your devices
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3210/tcp: 3210
ports_description:
  3210/tcp: Havelo devices connect here
watchdog: http://[HOST]:[PORT:3210]/health/ready
homeassistant_api: true
backup: hot
backup_pre: node /srv/data-service/src/home-assistant.js backup-pre
backup_post: node /srv/data-service/src/home-assistant.js backup-post
backup_exclude:
  - havelo.sqlite
  - havelo.sqlite-wal
  - havelo.sqlite-shm
  - havelo.sqlite.lock
  - havelo.sqlite.before-restore-*
  - backups
options:
  addresses: []
schema:
  addresses:
    - str
  storage_limit_mib: int(1,4096)?
