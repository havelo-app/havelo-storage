configuration:
  addresses:
    name: Addresses
    description: >-
      How your devices reach Home Assistant, used in setup codes: a name such
      as homeassistant.local, an IP address or a tailnet name. Add the port if
      you changed it. Defaults to homeassistant.local.
  storage_limit_mib:
    name: Storage per person (MiB)
    description: >-
      How much each person can keep, counting saved maps and cards. Defaults
      to 64 MiB.
network:
  3210/tcp: Havelo devices connect here.
